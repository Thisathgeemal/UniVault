# Python tooling config for the UniVault AI anomaly service.
#
# Installing Ruff in a virtual environment (run inside ai-service/):
#   python -m venv .venv
#   Windows:      .venv\Scripts\activate
#   macOS/Linux:  source .venv/bin/activate
#   python -m pip install ruff
# Then:
#   ruff check .          # lint
#   ruff check . --fix    # lint and auto-fix
#   ruff format .         # format

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "venv", "models"]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort (import order), B: flake8-bugbear
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
